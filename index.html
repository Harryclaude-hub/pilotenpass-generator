<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ausweis-Atlas</title>
<meta name="description" content="Nachschlageseite: Wie sehen Reisepass und Personalausweis eines Landes aus? Land wählen und zu den öffentlichen Mustern gehen.">
<style>
:root{--bg:#f4f2ee;--ink:#1b1c1f;--mut:#6b6d73;--panel:#fff;--line:#dedad2;--acc:#1f4fd8;--acc2:#e9eefc}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--ink:#eceef2;--mut:#9a9da6;--panel:#1b1d22;--line:#2d3037;--acc:#7da2ff;--acc2:#1c2540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:36px 20px 60px}
h1{font-size:34px;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 22px}
input[type=text]{width:100%;max-width:440px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:99px;font:14px system-ui;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--acc);transform:translateY(-2px)}
.tile b{font-size:16px}
.tile span{font:12px ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:.08em}
.empty{color:var(--mut);padding:30px 0}
.back{all:unset;cursor:pointer;color:var(--acc);margin-bottom:18px;display:inline-block}
.back:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{margin:0 0 4px;font-size:22px}
.card p{margin:0 0 16px;color:var(--mut);font-size:14px}
.btn{display:block;padding:12px 14px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn small{display:block;opacity:.75;font-size:12px}
.note{margin-top:26px;font-size:13px;color:var(--mut);max-width:70ch}
[dir=rtl] .btn,[dir=rtl] .card{text-align:right}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Sprache je Land: nur die wenigen Beschriftungen. Die Seiten dahinter (PRADO, Wikipedia, Commons) sind in der Regel englisch. */
const T={
de:{passport:'Reisepass',idcard:'Personalausweis',prado:'Offizielle Muster ansehen',pradoS:'PRADO, Register des Rates der EU',wiki:'Beschreibung und Bilder',wikiS:'Wikipedia',commons:'Fotos von Mustern',commonsS:'Wikimedia Commons',back:'← Alle Länder',note:'Diese Seite zeigt keine Dokumente selbst, sondern führt zu öffentlichen Quellen. Es sind Anschauungsmuster, keine Vorlagen zum Nachbauen.'},
en:{passport:'Passport',idcard:'National ID card',prado:'View official specimens',pradoS:'PRADO, Council of the EU register',wiki:'Description and images',wikiS:'Wikipedia',commons:'Specimen photos',commonsS:'Wikimedia Commons',back:'← All countries',note:'This page does not show documents itself, it links to public sources. These are for reference, not templates to copy.'},
fr:{passport:'Passeport',idcard:'Carte d\'identité',prado:'Voir les spécimens officiels',pradoS:'PRADO, registre du Conseil de l\'UE',wiki:'Description et images',wikiS:'Wikipédia',commons:'Photos de spécimens',commonsS:'Wikimedia Commons',back:'← Tous les pays',note:'Cette page n\'affiche aucun document, elle renvoie vers des sources publiques. Ce sont des exemples à consulter, pas des modèles à copier.'},
es:{passport:'Pasaporte',idcard:'Documento de identidad',prado:'Ver especímenes oficiales',pradoS:'PRADO, registro del Consejo de la UE',wiki:'Descripción e imágenes',wikiS:'Wikipedia',commons:'Fotos de especímenes',commonsS:'Wikimedia Commons',back:'← Todos los países',note:'Esta página no muestra documentos, enlaza a fuentes públicas. Son ejemplos para consultar, no plantillas para copiar.'},
it:{passport:'Passaporto',idcard:'Carta d\'identità',prado:'Vedi i campioni ufficiali',pradoS:'PRADO, registro del Consiglio UE',wiki:'Descrizione e immagini',wikiS:'Wikipedia',commons:'Foto di campioni',commonsS:'Wikimedia Commons',back:'← Tutti i paesi',note:'Questa pagina non mostra documenti, rimanda a fonti pubbliche. Sono esempi da consultare, non modelli da copiare.'},
pt:{passport:'Passaporte',idcard:'Cartão de identificação',prado:'Ver espécimes oficiais',pradoS:'PRADO, registo do Conselho da UE',wiki:'Descrição e imagens',wikiS:'Wikipédia',commons:'Fotos de espécimes',commonsS:'Wikimedia Commons',back:'← Todos os países',note:'Esta página não mostra documentos, remete para fontes públicas. São exemplos para consulta, não modelos para copiar.'},
tr:{passport:'Pasaport',idcard:'Kimlik kartı',prado:'Resmi örnekleri gör',pradoS:'PRADO, AB Konseyi kaydı',wiki:'Açıklama ve görseller',wikiS:'Vikipedi',commons:'Örnek fotoğrafları',commonsS:'Wikimedia Commons',back:'← Tüm ülkeler',note:'Bu sayfa belge göstermez, herkese açık kaynaklara yönlendirir. Başvuru içindir, kopyalanacak şablon değildir.'},
ru:{passport:'Паспорт',idcard:'Удостоверение личности',prado:'Официальные образцы',pradoS:'PRADO, реестр Совета ЕС',wiki:'Описание и изображения',wikiS:'Википедия',commons:'Фото образцов',commonsS:'Wikimedia Commons',back:'← Все страны',note:'Эта страница сама не показывает документы, а ведёт к открытым источникам. Это справочный материал, а не шаблоны для копирования.'},
pl:{passport:'Paszport',idcard:'Dowód osobisty',prado:'Zobacz oficjalne wzory',pradoS:'PRADO, rejestr Rady UE',wiki:'Opis i obrazy',wikiS:'Wikipedia',commons:'Zdjęcia wzorów',commonsS:'Wikimedia Commons',back:'← Wszystkie kraje',note:'Ta strona nie pokazuje dokumentów, prowadzi do publicznych źródeł. To materiał poglądowy, nie szablony do kopiowania.'},
nl:{passport:'Paspoort',idcard:'Identiteitskaart',prado:'Officiële specimens bekijken',pradoS:'PRADO, register van de Raad van de EU',wiki:'Beschrijving en afbeeldingen',wikiS:'Wikipedia',commons:'Foto\'s van specimens',commonsS:'Wikimedia Commons',back:'← Alle landen',note:'Deze pagina toont zelf geen documenten, maar verwijst naar openbare bronnen. Ter illustratie, geen sjablonen om na te maken.'},
hr:{passport:'Putovnica',idcard:'Osobna iskaznica',prado:'Pogledaj službene uzorke',pradoS:'PRADO, registar Vijeća EU',wiki:'Opis i slike',wikiS:'Wikipedija',commons:'Fotografije uzoraka',commonsS:'Wikimedia Commons',back:'← Sve zemlje',note:'Ova stranica sama ne prikazuje isprave, već vodi na javne izvore. Služi kao informacija, a ne kao predložak za kopiranje.'},
el:{passport:'Διαβατήριο',idcard:'Ταυτότητα',prado:'Επίσημα δείγματα',pradoS:'PRADO, μητρώο του Συμβουλίου της ΕΕ',wiki:'Περιγραφή και εικόνες',wikiS:'Βικιπαίδεια',commons:'Φωτογραφίες δειγμάτων',commonsS:'Wikimedia Commons',back:'← Όλες οι χώρες',note:'Η σελίδα δεν δείχνει η ίδια έγγραφα, παραπέμπει σε δημόσιες πηγές. Είναι για ενημέρωση, όχι πρότυπα προς αντιγραφή.'},
sv:{passport:'Pass',idcard:'ID-kort',prado:'Se officiella exemplar',pradoS:'PRADO, EU-rådets register',wiki:'Beskrivning och bilder',wikiS:'Wikipedia',commons:'Foton av exemplar',commonsS:'Wikimedia Commons',back:'← Alla länder',note:'Sidan visar inga handlingar själv utan länkar till offentliga källor. Det är informationsmaterial, inte mallar att kopiera.'},
ar:{passport:'جواز السفر',idcard:'بطاقة الهوية',prado:'عرض النماذج الرسمية',pradoS:'PRADO، سجل مجلس الاتحاد الأوروبي',wiki:'الوصف والصور',wikiS:'ويكيبيديا',commons:'صور النماذج',commonsS:'ويكيميديا كومنز',back:'→ كل الدول',note:'لا تعرض هذه الصفحة وثائق بنفسها، بل تحيل إلى مصادر عامة. هي للاطلاع وليست قوالب للنسخ.'}
};
/* Alle Länder: ISO3:ISO2:Region. Region: EU Europa, NA Nordamerika, AS Asien, NAF Nordafrika/Naher Osten, SA Lateinamerika, AF Afrika, OC Ozeanien.
   PRADO (Register des Rates der EU) hat für jedes dieser Länder eine Seite, außer den im Code unter NOPRADO genannten (geprüft am 22.11.2026). */
const NOPRADO=new Set(['IDN','ATG','BRB','BOL','MMR','SWZ','FJI','GTM','KIR','MHL','FSM','NRU','NER','PNG','WSM','LCA','VCT','SLB','TON','TTO','VUT','PSE','MUS','PRI']);
const TAB='AFG:AF:AS AGO:AO:AF ALB:AL:EU AND:AD:EU ARE:AE:NAF ARG:AR:SA ARM:AM:AS AUS:AU:OC AUT:AT:EU AZE:AZ:AS BDI:BI:AF BEL:BE:EU BEN:BJ:AF BFA:BF:AF BGD:BD:AS BGR:BG:EU BHR:BH:NAF BHS:BS:SA BIH:BA:EU BLR:BY:EU BLZ:BZ:SA BRA:BR:SA BRN:BN:AS BTN:BT:AS BWA:BW:AF CAF:CF:AF CAN:CA:NA CHE:CH:EU CHL:CL:SA CHN:CN:AS CIV:CI:AF CMR:CM:AF COD:CD:AF COG:CG:AF COL:CO:SA COM:KM:AF CPV:CV:AF CRI:CR:SA CUB:CU:SA CYP:CY:EU CZE:CZ:EU DEU:DE:EU DJI:DJ:AF DMA:DM:SA DNK:DK:EU DOM:DO:SA DZA:DZ:NAF ECU:EC:SA EGY:EG:NAF ERI:ER:AF ESP:ES:EU EST:EE:EU ETH:ET:AF FIN:FI:EU FRA:FR:EU GAB:GA:AF GBR:GB:EU GEO:GE:AS GHA:GH:AF GIN:GN:AF GMB:GM:AF GNB:GW:AF GNQ:GQ:AF GRC:GR:EU GRD:GD:SA GUY:GY:SA HND:HN:SA HRV:HR:EU HTI:HT:SA HUN:HU:EU IDN:ID:AS IND:IN:AS IRL:IE:EU IRN:IR:NAF IRQ:IQ:NAF ISL:IS:EU ISR:IL:NAF ITA:IT:EU JAM:JM:SA JOR:JO:NAF JPN:JP:AS KAZ:KZ:AS KEN:KE:AF KGZ:KG:AS KHM:KH:AS KNA:KN:SA KOR:KR:AS KWT:KW:NAF LAO:LA:AS LBN:LB:NAF LBR:LR:AF LBY:LY:NAF LIE:LI:EU LKA:LK:AS LSO:LS:AF LTU:LT:EU LUX:LU:EU LVA:LV:EU MAR:MA:NAF MCO:MC:EU MDA:MD:EU MDG:MG:AF MDV:MV:AS MEX:MX:NA MKD:MK:EU MLI:ML:AF MLT:MT:EU MNE:ME:EU MNG:MN:AS MOZ:MZ:AF MRT:MR:NAF MWI:MW:AF MYS:MY:AS NAM:NA:AF NGA:NG:AF NIC:NI:SA NLD:NL:EU NOR:NO:EU NPL:NP:AS NZL:NZ:OC OMN:OM:NAF PAK:PK:AS PAN:PA:SA PER:PE:SA PHL:PH:AS PLW:PW:OC POL:PL:EU PRK:KP:AS PRT:PT:EU PRY:PY:SA QAT:QA:NAF ROU:RO:EU RUS:RU:EU RWA:RW:AF SAU:SA:NAF SDN:SD:NAF SEN:SN:AF SGP:SG:AS SLE:SL:AF SLV:SV:SA SMR:SM:EU SOM:SO:AF SRB:RS:EU SSD:SS:AF STP:ST:AF SUR:SR:SA SVK:SK:EU SVN:SI:EU SWE:SE:EU SYC:SC:AF SYR:SY:NAF TCD:TD:AF TGO:TG:AF THA:TH:AS TKM:TM:AS TLS:TL:AS TUN:TN:NAF TUR:TR:EU TUV:TV:OC TWN:TW:AS TZA:TZ:AF UGA:UG:AF UKR:UA:EU URY:UY:SA USA:US:NA UZB:UZ:AS VAT:VA:EU VEN:VE:SA VNM:VN:AS YEM:YE:NAF ZAF:ZA:AF ZMB:ZM:AF ZWE:ZW:AF ATG:AG:SA BRB:BB:SA BOL:BO:SA GTM:GT:SA MMR:MM:AS SWZ:SZ:AF FJI:FJ:OC KIR:KI:OC MHL:MH:OC FSM:FM:OC NRU:NR:OC NER:NE:AF PNG:PG:OC WSM:WS:OC LCA:LC:SA VCT:VC:SA SLB:SB:OC TON:TO:OC TTO:TT:SA VUT:VU:OC PSE:PS:NAF MUS:MU:AF PRI:PR:SA XKX:XK:EU HKG:HK:AS MAC:MO:AS GIB:GI:EU GRL:GL:NA FRO:FO:EU IMN:IM:EU JEY:JE:EU GGY:GG:EU BMU:BM:NA AIA:AI:SA TCA:TC:SA VGB:VG:SA MSR:MS:SA NCL:NC:OC PYF:PF:OC SHN:SH:AF';
const LANG={de:'AT DE CH LI',fr:'FR BE',nl:'NL',it:'IT SM VA',es:'ES MX AR CL CO PE VE UY EC CR CU DO GT HN NI PA PY SV BO',pt:'PT BR',tr:'TR',ru:'RU',pl:'PL',hr:'HR BA',el:'GR CY',sv:'SE',ar:'MA DZ TN LY EG AE SA LB JO IQ KW QA BH OM YE SY SD MR'};
const L2={};for(const k in LANG)LANG[k].split(' ').forEach(i=>L2[i]=k);
const dn=l=>{try{return new Intl.DisplayNames([l],{type:'region'})}catch(e){return {of:x=>x}}};
const DN={de:dn('de'),en:dn('en')};
/* [Code, Name im Land, englischer Name, Region, Sprache, deutscher Name] */
const C=TAB.split(' ').map(x=>{const [c3,c2,r]=x.split(':');const lang=L2[c2]||'en';DN[lang]=DN[lang]||dn(lang);
  return [c3,DN[lang].of(c2)||c2,DN.en.of(c2)||c2,r,lang,DN.de.of(c2)||c2]}).sort((a,b)=>a[5].localeCompare(b[5],'de'));
const REG=[['ALL','Alle / All'],['EU','Europa'],['NA','Nordamerika / North America'],['AS','Asien / Asia'],['NAF','Nordafrika, Naher Osten / N. Africa, Middle East'],['SA','Lateinamerika / Latin America'],['AF','Afrika / Africa'],['OC','Ozeanien / Oceania']];
let region='ALL',q='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wiki=(n,w)=>`https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(n+' '+w)}`;
const commons=(n,w)=>`https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(n+' '+w)}&ns6=1`;

function home(){
  document.title='Ausweis-Atlas';document.documentElement.lang='de';document.documentElement.dir='ltr';
  const list=C.filter(c=>(region==='ALL'||c[3]===region)&&(!q||(c[1]+' '+c[2]+' '+c[5]+' '+c[0]).toLowerCase().includes(q)));
  app.innerHTML=`<h1>Ausweis-Atlas</h1>
   <p class="sub">Wie sehen Reisepass und Personalausweis eines Landes aus? Land wählen. / Pick a country to see what its passport and ID card look like.</p>
   <input type="text" id="s" placeholder="Suchen / Search …" value="${esc(q)}" autocomplete="off">
   <div class="chips">${REG.map(r=>`<button class="chip" data-r="${r[0]}" aria-pressed="${r[0]===region}">${esc(r[1])}</button>`).join('')}</div>
   <div id="grid">${list.map(c=>`<button class="tile" data-c="${c[0]}"><b>${esc(c[5])}</b><span>${c[0]}</span></button>`).join('')||'<p class="empty">–</p>'}</div>
   <p class="note">Nachschlageseite zu öffentlichen Quellen. Keine Dokumente werden hier gespeichert oder nachgebaut.<br>Reference page linking to public sources. No documents are stored or recreated here.</p>`;
  const s=document.getElementById('s');
  s.addEventListener('input',e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;home();const n=document.getElementById('s');n.focus();n.setSelectionRange(p,p)});
}
function detail(code){
  const c=C.find(x=>x[0]===code);if(!c){location.hash='';return}
  const t=T[c[4]];const rtl=c[4]==='ar';
  document.title=c[1]+' · Ausweis-Atlas';document.documentElement.lang=c[4];document.documentElement.dir=rtl?'rtl':'ltr';
  const card=(title,what)=>`<section class="card"><h2>${esc(title)}</h2><p>${esc(c[1])}</p>
   ${!NOPRADO.has(code)?`<a class="btn main" target="_blank" rel="noopener noreferrer" href="https://www.consilium.europa.eu/prado/en/prado-documents/${code}/index.html">${esc(t.prado)}<small>${esc(t.pradoS)}</small></a>`:''}
   <a class="btn" target="_blank" rel="noopener noreferrer" href="${wiki(c[2],what)}">${esc(t.wiki)}<small>${esc(t.wikiS)}</small></a>
   <a class="btn" target="_blank" rel="noopener noreferrer" href="${commons(c[2],what)}">${esc(t.commons)}<small>${esc(t.commonsS)}</small></a></section>`;
  app.innerHTML=`<button class="back" id="b">${esc(t.back)}</button><h1>${esc(c[1])}</h1><p class="sub">${c[0]} · ${esc(c[2])}</p>
   <div class="cards">${card(t.passport,'passport')}${card(t.idcard,'national identity card')}</div><p class="note">${esc(t.note)}</p>`;
  document.getElementById('b').addEventListener('click',()=>{location.hash=''});
}
function route(){const h=location.hash.replace('#','');h?detail(h):home();window.scrollTo(0,0)}
app.addEventListener('click',e=>{
  const t=e.target.closest('.tile');if(t){location.hash=t.dataset.c;return}
  const r=e.target.closest('.chip');if(r){region=r.dataset.r;home()}
});
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
