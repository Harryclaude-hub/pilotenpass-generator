<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">

<title>Ausweis-Atlas</title>
<meta name="description" content="Nachschlagewerk: Reisepässe und Personalausweise aller Länder mit Vorderseite, Rückseite und Daten.">
<style>
:root{--bg:#0f1115;--bg2:#161a20;--ink:#e9ebf0;--mut:#9399a6;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.045);--acc:#8aa3c7;--acc2:#8f89b0;--onacc:#10131a;--ok:#8fc4a8;--no:#d49a8a}
@media (prefers-color-scheme:light){:root{--bg:#f2f0ec;--bg2:#fff;--ink:#16181d;--mut:#5e6472;--line:rgba(0,0,0,.1);--glass:rgba(0,0,0,.035);--acc:#35557f;--acc2:#5d5589;--onacc:#fff;--ok:#2f7a55;--no:#a4533f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(120px);opacity:.08;z-index:0;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.orb.a{background:var(--acc);top:-25vmax;left:-15vmax}
.orb.b{background:var(--acc2);bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:44px 20px 70px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.03em;margin:0 0 10px;font-weight:750}
h1 em{font-style:normal;color:var(--acc)}
.sub{color:var(--mut);margin:0 0 26px;max-width:62ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 26px;color:var(--mut);font-size:14px}
.stats b{color:var(--ink);font-size:22px;display:block;letter-spacing:-.02em}
input[type=text],input[type=password]{width:100%;max-width:460px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font:inherit;outline:none}
input:focus-visible{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 14px;border-radius:99px;font:14px system-ui;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:104px;border-radius:16px;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;border:1px solid var(--line);background:#222 center/cover no-repeat;transition:transform .18s,box-shadow .18s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,16,.15),rgba(8,10,16,.82))}
.tile>*{position:relative}
.tile:hover,.tile:focus-visible{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.tile b{font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile span{font:11px ui-monospace,Consolas,monospace;opacity:.8;letter-spacing:.1em}
.empty{color:var(--mut);padding:30px 0}
.back{all:unset;cursor:pointer;color:var(--acc);margin-bottom:20px;display:inline-block;font-weight:600}
.back:hover{text-decoration:underline}
.banner{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.banner img{width:84px;height:63px;object-fit:cover;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin:22px 0 18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:10px 18px;border-radius:12px;font:600 15px system-ui;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.doc{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.doc h3{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
.doc .ttl{color:var(--mut);font-size:13px;margin-bottom:14px;word-break:break-word}
.badge{display:inline-block;font:600 11px system-ui;padding:3px 9px;border-radius:99px;margin-inline-start:8px;vertical-align:middle;letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.badge.no{background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no)}.badge.t{background:var(--glass);color:var(--mut)}
.imgs{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
figure img{height:380px;width:auto;max-width:100%;border-radius:8px;background:var(--glass);border:1px solid var(--line);cursor:zoom-in;box-shadow:0 6px 18px rgba(0,0,0,.3)}
figcaption{font-size:12px;color:var(--mut)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:0 0 14px}
.facts div small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.facts div b{font-weight:600}
.src{color:var(--acc);font-size:14px;text-decoration:none}
.src:hover{text-decoration:underline}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);text-decoration:none;font-size:15px}
.btn:hover{border-color:var(--acc)}
.note{margin-top:30px;font-size:13px;color:var(--mut);max-width:72ch}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
.gate{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .box{width:100%;max-width:380px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:34px 26px;backdrop-filter:blur(16px)}
.gate h1{font-size:34px}
.gate input{text-align:center;font-size:30px;letter-spacing:.5em;padding:14px 10px 14px 24px;max-width:240px}
.gate p{color:var(--mut);font-size:14px;min-height:1.4em}
.shell{position:relative;z-index:1;max-width:2400px;margin:0 auto;display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
.shell .wrap{max-width:none;margin:0;padding:44px 40px 80px 12px}
.rail{position:sticky;top:0;max-height:100vh;overflow:auto;padding:44px 6px 30px 24px;font-size:14px;background:linear-gradient(90deg,var(--glass),transparent)}
.rtabs{display:flex;gap:6px;margin:0 0 14px}
.rtabs button{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:9px 10px;border-radius:10px;font:600 13px system-ui;cursor:pointer}
.rtabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.rail h4{margin:0 0 10px;font:600 12px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.rail .empty{padding:6px 0;font-size:13px}
.rc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer;border:1px solid transparent}
.rc:hover{background:var(--glass);border-color:var(--line)}
.rc img{width:30px;height:22px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.mk{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.mk .top{display:flex;gap:10px;align-items:center}
.mk .th{width:42px;height:58px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--glass)}
.mk a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;cursor:pointer;word-break:break-all}
.mk a:hover{color:var(--acc)}
.mk small{display:block;color:var(--mut);font-size:12px}
.mk .x{margin-inline-start:auto;border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;line-height:1}
.mk textarea{width:100%;margin-top:8px;min-height:50px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--glass);color:var(--ink);font:13px/1.4 system-ui;padding:7px 8px}
.rtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.rtools button{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 11px;border-radius:10px;font:13px system-ui;cursor:pointer}
.rtools button:hover{border-color:var(--acc)}
.star{float:right;border:1px solid var(--line);background:var(--glass);color:var(--mut);border-radius:10px;padding:5px 11px;font:600 13px system-ui;cursor:pointer}
.star[aria-pressed=true]{color:var(--onacc);background:var(--acc);border-color:var(--acc)}
[dir=rtl] .star{float:left}
.fab{display:none;position:fixed;right:14px;bottom:14px;z-index:45;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:99px;padding:12px 18px;font:600 15px system-ui;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.doc.hl{outline:2px solid var(--acc);outline-offset:3px}
@media (max-width:1240px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .shell .wrap{padding:44px 20px 80px}
 .rail{position:fixed;left:0;top:0;bottom:0;width:min(350px,92vw);max-height:none;background:var(--bg2);border-inline-end:1px solid var(--line);z-index:44;transform:translateX(-105%);transition:transform .22s;padding-left:20px}
 .rail.open{transform:none}
 .fab{display:block;left:14px;right:auto}
}
@media print{.orb,.wrap,.fab,#lb,.rtabs{display:none!important}.shell{display:block}.rail{position:static;transform:none;width:auto;max-height:none;background:none;padding:0}.rtools{display:none}body{background:#fff;color:#000}.mk{border-color:#999;break-inside:avoid}}
.grp{margin-bottom:34px}
.grp>h2{font-size:22px;letter-spacing:-.01em;margin:6px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.exp{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;font-size:15px;line-height:1.6;max-width:90ch}
.exp b.lbl{display:block;font:600 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.exp p{margin:0 0 6px}.exp p:last-child{margin:0}
.exp .df{color:var(--ink);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.sum{font-size:16px;line-height:1.6;max-width:90ch;margin:0 0 14px;color:var(--ink)}
details.why{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 24px;background:var(--glass);max-width:90ch}
details.why summary{cursor:pointer;font-weight:600}
details.why p{margin:10px 0 0;line-height:1.6;color:var(--mut)}
details.why p b{color:var(--ink)}
.mdl{font:600 11px system-ui;color:var(--mut);margin-inline-start:8px}
@media (max-width:600px){figure img{height:240px}.doc{padding:18px}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div id="lb"><img alt=""></div>
<div id="app"></div>
<script>
/* Zugangscode (4 Ziffern): nur eine Tuersteher-Sperre im Browser, kein echter Schutz. */
const PIN_HASH='54f539ff2d7c783b7ffbc6f088e12239884bd32b53b07858cb92a647640b87dd';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let fails=0,lockUntil=0;
function isOpen(){try{return sessionStorage.getItem('atlas-ok')==='1'}catch(e){return false}}
function gate(){
  document.title='Ausweis-Atlas';
  app.innerHTML=`<div class="gate"><div class="box"><h1><em>Ausweis</em>-Atlas</h1><p>Zugangscode / Access code</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Code"><p id="msg"></p></div></div>`;
  const i=document.getElementById('pin'),m=document.getElementById('msg');i.focus();
  i.addEventListener('input',async()=>{
    i.value=i.value.replace(/\D/g,'');
    if(i.value.length<4)return;
    if(Date.now()<lockUntil){m.textContent='Bitte kurz warten / Please wait';i.value='';return}
    if(await sha('atlas-'+i.value)===PIN_HASH){try{sessionStorage.setItem('atlas-ok','1')}catch(e){}route()}
    else{fails++;i.value='';m.textContent='Falscher Code / Wrong code';if(fails>=5){lockUntil=Date.now()+30000;fails=0}}
  });
}

let LAattr='';
const TYPORD=['O','P','S','D','F','Y'];
const TYPNAME={A:{O:'Normale Reisepässe',P:'Vorläufige Pässe (Notpässe)',S:'Dienstpässe',D:'Diplomatenpässe',F:'Sonderausweise',Y:'Sonderfälle und Zusatzdokumente'},B:{O:'Normale Personalausweise',P:'Vorläufige Personalausweise',S:'Dienstausweise',D:'Diplomatenausweise',F:'Sonderausweise (zum Beispiel für Soldaten)',Y:'Sonderfälle und Zusatzdokumente'}};
const TYPSING={A:{O:'normaler Reisepass',P:'vorläufiger Pass',S:'Dienstpass',D:'Diplomatenpass',F:'Sonderausweis',Y:'Sonderfall'},B:{O:'normaler Personalausweis',P:'vorläufiger Ausweis',S:'Dienstausweis',D:'Diplomatenausweis',F:'Sonderausweis',Y:'Sonderfall'}};
const TYPTXT={
 A:{O:'Der normale Pass für Bürgerinnen und Bürger. Damit reisen die meisten Menschen.',
    P:'Ein Notpass: nur kurz gültig und schnell ausgestellt, wenn jemand dringend einen Pass braucht, zum Beispiel nach einem Verlust im Ausland.',
    S:'Ein Dienstpass (auch Amts- oder Sonderpass): für Beamte und Staatsbedienstete auf Dienstreisen. Für private Reisen ist er nicht gedacht.',
    D:'Ein Diplomatenpass: nur für Diplomaten und hohe Regierungsvertreter im Dienst. Normale Bürger bekommen ihn nicht.',
    F:'Ein Sonderausweis für eine bestimmte Gruppe, zum Beispiel Soldaten. Kein normaler Pass.',
    Y:'Ein Sonderfall, der kein normaler Pass ist, zum Beispiel ein Sammelpass für Gruppen oder ein Klebeetikett für Eintragungen.'},
 B:{O:'Der normale Personalausweis für Bürgerinnen und Bürger im Alltag.',
    P:'Ein vorläufiger Ausweis: zeitlich begrenzt, als Ersatz, bis der richtige Ausweis fertig ist.',
    S:'Ein Dienstausweis für Staatsbedienstete.',
    D:'Ein Ausweis für Diplomaten.',
    F:'Ein Sonderausweis für eine bestimmte Gruppe, zum Beispiel Soldaten im aktiven Dienst.',
    Y:'Ein Sonderfall, kein normaler Ausweis, zum Beispiel ein Begleitblatt.'}};
const fmtD=s=>{const m=(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[1]+'.'+m[2]+'.'+m[3]:''};
function typeOf(d){return (d[0].split('-')[1]||'XO')[1]||'O'}
function explain(d,grp,i){
  const [id,title,cat,typ,first,until,valid,w,h,pages,maxv]=d;
  const c=cat==='B'?'B':'A',tl=typeOf(d);
  const out=[TYPTXT[c][tl]||'Ein Sonderfall.'];
  const f=(first||'').match(/(\d{4})$/);
  if(first){const y=new Date().getFullYear()-(+f[1]);out.push(`Erstmals ausgestellt am ${fmtD(first)}${y>0?` (vor etwa ${y} Jahr${y===1?'':'en'})`:''}.`)}
  if(valid==='no')out.push('Dieses Modell ist nicht mehr gültig. Es steht im Register, damit man alte Dokumente erkennen kann.');
  else if(i===0&&grp.length>1)out.push('Das neueste Modell dieser Art im Register.');
  else if(i===0)out.push('Das einzige Modell dieser Art im Register.');
  else if(valid==='yes')out.push('Ein älteres Modell, aber noch gültig. Wer so ein Dokument hat, darf es bis zum Ablauf benutzen. Deshalb sind oft mehrere Modelle gleichzeitig unterwegs.');
  else out.push('Ein älteres Modell.');
  if(until)out.push(`Spätestens ab ${fmtD(until)} nicht mehr gültig.`);
  let diff='';const prev=grp[i+1];
  if(prev){
    const ds=[];
    if(pages&&prev[9]&&pages!==prev[9])ds.push(`${pages} statt ${prev[9]} Seiten`);
    if(w&&h&&prev[7]&&prev[8]&&(w!==prev[7]||h!==prev[8]))ds.push(`Format ${w} × ${h} mm statt ${prev[7]} × ${prev[8]} mm`);
    if(maxv&&prev[10]&&maxv!==prev[10])ds.push(`Höchstgültigkeit ${maxv} statt ${prev[10]} Jahre`);
    diff=ds.length?`<div class="df"><b>Unterschied zum Vorgänger (${esc(prev[0])}):</b> ${esc(ds.join('; '))}.</div>`
        :`<div class="df"><b>Zum Vorgänger (${esc(prev[0])}):</b> Bei Seiten, Format und Gültigkeit gibt es laut Register keinen Unterschied. Die Änderungen stecken meist in Design und Sicherheitsmerkmalen, die du über den Quelllink findest.</div>`;
  }
  return `<p>${esc(out.join(' '))}</p>${diff}`;
}
function docCard(d,t,grp,i){
  const [id,title,cat,typ,first,until,valid,w,h,pages,maxv,fr,bk,dt]=d;
  const tl=({O:t.ord,D:t.dip,S:t.svc})[typeOf(d)]||t.oth;
  const fig=(f,cap)=>f?`<figure><img loading="lazy" referrerpolicy="no-referrer" src="${PRADO_IMG}${id}/${f}" alt="${esc(cap)}" data-z="1"><figcaption ${LAattr}>${esc(cap)}</figcaption></figure>`:'';
  const fact=(k,v)=>v?`<div ${LAattr}><small>${esc(k)}</small><b>${esc(v)}</b></div>`:'';
  return `<article class="doc" id="d-${esc(id)}"><button class="star" data-id="${esc(id)}" data-code="${esc(id.slice(0,3))}" aria-pressed="${marks[id]?'true':'false'}">★ ${esc(t.mark||'Merken')}</button><h3>${esc(id)}<span class="badge t" ${LAattr}>${esc(tl)}</span>${valid==='yes'?`<span class="badge ok" ${LAattr}>${esc(t.ok)}</span>`:valid==='no'?`<span class="badge no" ${LAattr}>${esc(t.no)}</span>`:''}${grp.length>1?`<span class="mdl">Modell ${grp.length-i} von ${grp.length}</span>`:''}</h3>
   <div class="ttl">${esc(title)}</div>
   <div class="exp"><b class="lbl">Erklärung</b>${explain(d,grp,i)}</div>
   <div class="imgs">${fig(fr,t.front)}${fig(bk,t.bck)}${fig(dt,t.data)}</div>
   <div class="facts">${fact(t.issued,first)}${fact(t.size,w&&h?w+' × '+h+' mm':'')}${fact(t.pages,pages)}${fact(t.maxv,maxv?maxv+' '+t.years:'')}</div>
   <a class="src" ${LAattr} target="_blank" rel="noopener noreferrer" href="${PRADO_DOC}${id}/index.html">${esc(t.source)}: PRADO ${esc(id)} ↗</a></article>`;
}
function groupsOf(list){
  const g={};list.forEach(d=>{(g[typeOf(d)]=g[typeOf(d)]||[]).push(d)});
  Object.values(g).forEach(a=>a.sort((x,y)=>dkey(y[4])<dkey(x[4])?-1:dkey(y[4])>dkey(x[4])?1:0));
  const keys=Object.keys(g).sort((a,b)=>{const ia=TYPORD.indexOf(a),ib=TYPORD.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  return keys.map(k=>[k,g[k]]);
}
function detail(code){
  const c=C.find(x=>x[0]===code);if(!c){location.hash='';return}
  const t=T[c[4]];const rtl=RTL.has(c[4]);
  document.title=c[1]+' · Ausweis-Atlas';document.documentElement.lang='de';document.documentElement.dir='ltr';LAattr=`lang="${c[4]}" dir="auto"`;
  const docs=(DB&&DB[code])||[];
  const mine=cat=>docs.filter(d=>(d[2]||'').startsWith(cat));
  const A=mine('A'),B=mine('B');
  if(tab==='A'&&!A.length&&B.length)tab='B';if(tab==='B'&&!B.length&&A.length)tab='A';
  const cur=tab==='B'?B:A;
  const what=tab==='B'?'national identity card':'passport';
  const gr=groupsOf(cur);
  const sum=cur.length?`<p class="sum"><b>${esc(c[5])}:</b> ${cur.length} Einträge im Register${gr.length?', und zwar '+gr.map(([k,a])=>a.length+' × '+(TYPSING[tab==='B'?'B':'A'][k]||'Sonderfall')).join(', '):''}. Sortiert nach Art, innerhalb jeder Art das neueste Modell zuerst.</p>`:'';
  const why=cur.length?`<details class="why"><summary>Warum gibt es mehrere, und was bedeuten die Codes?</summary>
    <p><b>Warum mehrere?</b> Staaten bringen alle paar Jahre ein neues Modell heraus, meist mit besseren Sicherheitsmerkmalen. Die alten bleiben bis zum Ablaufdatum gültig, deshalb sind oft mehrere Modelle gleichzeitig im Umlauf. Dazu kommen Dokumente für besondere Gruppen: Diplomaten, Beamte im Dienst, Notfälle.</p>
    <p><b>Die Kennung</b>, zum Beispiel <b>AFG-AO-04001</b>: AFG ist das Land. Der erste Buchstabe danach sagt, was es ist (A = Pass, B = Ausweiskarte), der zweite die Art (O = normal, S = Dienst, D = Diplomat, P = vorläufig). Die Zahl ist die Modellnummer im Register.</p>
    <p><b>Gültig</b> heißt: Das Dokument darf laut Register noch benutzt werden, falls jemand es besitzt. Es heißt nicht, dass es noch neu ausgestellt wird.</p></details>`:'';
  const links=`<div class="links">${!NOPRADO.has(code)?`<a class="btn" ${LAattr} target="_blank" rel="noopener noreferrer" href="https://www.consilium.europa.eu/prado/en/prado-documents/${code}/index.html">${esc(t.prado)} ↗</a>`:''}
    <a class="btn" ${LAattr} target="_blank" rel="noopener noreferrer" href="${wiki(c[2],what)}">${esc(t.wiki)} ↗</a>
    <a class="btn" ${LAattr} target="_blank" rel="noopener noreferrer" href="${commons(c[2],what)}">${esc(t.commons)} ↗</a></div>`;
  const body=gr.length?gr.map(([k,a])=>`<section class="grp"><h2>${esc(TYPNAME[tab==='B'?'B':'A'][k]||'Sonstige')} (${a.length})</h2>${a.map((d,i)=>docCard(d,t,a,i)).join('')}</section>`).join(''):`<p class="empty" ${LAattr}>${esc(t.none)}</p>`;
  app.innerHTML=`<div class="wrap"><button class="back" id="b" ${LAattr}>${esc(t.back)}</button>
   <div class="banner"><img src="${flag(c[6])}" alt="" onerror="this.style.display='none'"><div><h1 ${LAattr} style="margin:0;font-size:clamp(28px,5vw,44px)">${esc(c[1])}</h1><div class="sub" style="margin:0">${c[0]} · ${esc(c[2])}</div></div></div>
   <div class="tabs" role="tablist"><button class="tab" role="tab" ${LAattr} data-t="A" aria-selected="${tab==='A'}">${esc(t.passport)} (${A.length})</button><button class="tab" role="tab" ${LAattr} data-t="B" aria-selected="${tab==='B'}">${esc(t.idcard)} (${B.length})</button></div>
   ${sum}${why}${body}
   ${links}<p class="note" ${LAattr}>${esc(t.note)}</p></div>`;
  document.getElementById('b').addEventListener('click',()=>{location.hash=''});
  pushRecent(code);rails();
}

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let marks=store.get('atlas-marks',{}),recent=store.get('atlas-recent',[]),IDX=null;
function buildIdx(){IDX={};for(const code in DB)for(const d of DB[code])IDX[d[0]]={d,code}}
function pushRecent(code){recent=[code,...recent.filter(x=>x!==code)].slice(0,12);store.set('atlas-recent',recent)}
let railTab=null;
function renderRails(){
  const L=app.querySelector('.rail.left');if(!L)return;
  const ids=Object.keys(marks);
  if(!railTab)railTab=ids.length?'marks':'recent';
  const tabs=`<div class="rtabs" role="tablist"><button role="tab" data-rt="marks" aria-selected="${railTab==='marks'}">★ Gemerkt (${ids.length})</button><button role="tab" data-rt="recent" aria-selected="${railTab==='recent'}">Verlauf</button></div>`;

  }else{
    body=(ids.length?ids.map(id=>{const m=marks[id],x=IDX&&IDX[id],c=C.find(y=>y[0]===m.code);const fr=x&&x.d[11];return `<div class="mk" data-id="${esc(id)}"><div class="top">${fr?`<img class="th" loading="lazy" referrerpolicy="no-referrer" src="${PRADO_IMG}${id}/${fr}" alt="">`:''}<div><a data-go="${esc(m.code)}" data-doc="${esc(id)}">${esc(id)}</a><small>${esc(c?c[5]:m.code)}</small></div><button class="x" data-rm="${esc(id)}" aria-label="Entfernen">×</button></div><textarea data-note="${esc(id)}" placeholder="Notiz …">${esc(m.note||'')}</textarea></div>`}).join(''):'<p class="empty">Mit ★ an einem Dokument merkst du es dir. Notizen bleiben in diesem Browser gespeichert.</p>')
     +(ids.length?`<div class="rtools"><button data-act="copy">Liste kopieren</button><button data-act="print">Drucken</button><button data-act="clear">Leeren</button></div>`:'');
  }
  L.innerHTML=tabs+body;
  const fab=document.getElementById('fab');if(fab)fab.textContent='★ '+ids.length;

function rails(){
  const w=app.querySelector('.wrap');if(!w)return;

  sh.innerHTML='<aside class="rail left" id="rl"></aside>';sh.appendChild(w);
  if(!document.getElementById('fab'))document.body.insertAdjacentHTML('beforeend','<button class="fab" id="fab" aria-label="Gemerkt und Verlauf"></button>');
  renderRails();
}
document.addEventListener('click',e=>{const rt=e.target.closest('[data-rt]');if(rt){railTab=rt.dataset.rt;renderRails()}});
let noteTimer=null;
document.addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){const id=st.dataset.id;if(marks[id]){delete marks[id];st.setAttribute('aria-pressed','false')}else{marks[id]={code:st.dataset.code,note:'',t:Date.now()};st.setAttribute('aria-pressed','true')}store.set('atlas-marks',marks);renderRails();return}
  const rm=e.target.closest('[data-rm]');if(rm){delete marks[rm.dataset.rm];store.set('atlas-marks',marks);renderRails();const s=document.querySelector('.star[data-id="'+rm.dataset.rm+'"]');if(s)s.setAttribute('aria-pressed','false');return}
  const go=e.target.closest('[data-go]');
  if(go){const code=go.dataset.go,doc=go.dataset.doc;const m=IDX&&IDX[doc];const want=m&&(m.d[2]==='B'?'B':'A');if(want)tab=want;location.hash.replace('#','')===code?detail(code):(location.hash=code);setTimeout(()=>{const el=document.getElementById('d-'+doc);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2200)}},350);document.getElementById('rl')?.classList.remove('open');return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='print')window.print();
    if(act==='clear'&&confirm('Merkliste leeren?')){marks={};store.set('atlas-marks',marks);renderRails();document.querySelectorAll('.star').forEach(s=>s.setAttribute('aria-pressed','false'))}
    if(act==='copy'){const txt=Object.keys(marks).map(id=>{const m=marks[id];return id+(m.note?' – '+m.note:'')+' – '+PRADO_DOC+id+'/index.html'}).join('\n');try{navigator.clipboard.writeText(txt);a.textContent='Kopiert ✓';setTimeout(()=>a.textContent='Liste kopieren',1500)}catch(err){}}
    return}
  if(e.target.closest('#fab')){document.getElementById('rl')?.classList.toggle('open')}
});
document.addEventListener('input',e=>{
  const n=e.target.closest('[data-note]');if(!n)return;
  const id=n.dataset.note;if(!marks[id])return;marks[id].note=n.value;clearTimeout(noteTimer);noteTimer=setTimeout(()=>store.set('atlas-marks',marks),300)});

/* ---- Als App installieren ---- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.querySelectorAll('.inst').forEach(b=>b.hidden=false)});
window.addEventListener('appinstalled',()=>{deferredInstall=null;document.querySelectorAll('.instwrap').forEach(b=>b.remove())});
function installHTML(){
  if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="instwrap" style="margin:0 0 18px"><button class="btn inst" ${deferredInstall?'':'hidden'}>📲 Als App installieren / Install as app</button>${ios?'<p class="note" style="margin:6px 0 0">iPhone: Teilen-Symbol, dann „Zum Home-Bildschirm“. / iPhone: Share, then “Add to Home Screen”.</p>':''}</div>`;
}
document.addEventListener('click',async e=>{if(e.target.closest('.inst')&&deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;document.querySelectorAll('.instwrap').forEach(b=>b.remove())}});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
async function route(){
  if(!isOpen()){gate();return}
  await loadDB();
  const h=location.hash.replace('#','');h?detail(h):home();window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const z=e.target.closest('img[data-z]');if(z){const lb=document.getElementById('lb');lb.firstElementChild.src=z.src;lb.style.display='flex';return}
  const tl=e.target.closest('.tile');if(tl){tab='A';location.hash=tl.dataset.c;return}
  const r=e.target.closest('.chip');if(r){region=r.dataset.r;home();return}
  const tb=e.target.closest('.tab');if(tb){tab=tb.dataset.t;detail(location.hash.replace('#',''))}
});
document.getElementById('lb').addEventListener('click',e=>{e.currentTarget.style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb').style.display='none'});
window.addEventListener('hashchange',route);
route();
</script>
</body>
